# Tiny Tapeout project information
project:
  title:        "Programmable 8-Bit CPU"      # Project title
  author:       "Yousef Tamer"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A custom programmable 8-bit CPU featuring an ALU, four registers, 16-bit instructions, conditional branching and external programming."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     16000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_youseftamereee_8_bit_cpu_tinytapeout"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "cpu.v"
    - "instruction_decoder.v"
    - "instruction_memory.v"
    - "processor.v"
    - "program_counter.v"
    - "register_file.v"
    - "tt_um_8bit_cpu.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "data_0"
  ui[1]: "data_1"
  ui[2]: "data_2"
  ui[3]: "data_3"
  ui[4]: "data_4"
  ui[5]: "data_5"
  ui[6]: "data_6"
  ui[7]: "data_7"

  # Outputs
  uo[0]: "acc_0"
  uo[1]: "acc_1"
  uo[2]: "acc_2"
  uo[3]: "acc_3"
  uo[4]: "acc_4"
  uo[5]: "acc_5"
  uo[6]: "acc_6"
  uo[7]: "acc_7"

  # Bidirectional pins
  uio[0]: "addr_0"
  uio[1]: "addr_1"
  uio[2]: "addr_2"
  uio[3]: "addr_3"
  uio[4]: "byte_sel"
  uio[5]: "write"
  uio[6]: "prog_mode"
  uio[7]: "unused"

# Do not change!
yaml_version: 6
